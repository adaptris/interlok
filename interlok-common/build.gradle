ext {
  componentName="Interlok Core/Common"
  componentDesc="Common components for Interlok"

  classesToTest = project.hasProperty("junit.test.classes") ? project.getProperty("junit.test.classes") : "**/com/adaptris/**/*Test*"
  verboseTests = project.hasProperty('verboseTests') ? project.getProperty('verboseTests') : "false"
  maxThreads = project.hasProperty("junit.threads") ? project.getProperty("junit.threads") : 1
  legacyDelombokTargetDir = new File("${project.projectDir}/src/main/generated")
  delombokTargetDir = new File("${project.buildDir}/generated/sources/delombok")
}

ext.verboseTestLogging = { ->
  return verboseTests.equals("true")
}

// In this section you declare the dependencies for your production and test code
dependencies {

  api project(':interlok-core-apt')
  api "com.thoughtworks.xstream:xstream"
  api "commons-io:commons-io"
  api "commons-net:commons-net"
  api "commons-pool:commons-pool"
  api "org.apache.commons:commons-lang3"
  api "org.apache.commons:commons-pool2"

  api "org.slf4j:slf4j-api"
  api "javax.servlet:javax.servlet-api"

  api "org.eclipse.jetty:jetty-alpn-client"
  api "org.eclipse.jetty:jetty-alpn-java-client"
  api "org.eclipse.jetty:jetty-alpn-server"
  api "org.eclipse.jetty:jetty-alpn-java-server"
  api "org.eclipse.jetty:jetty-annotations"
  api "org.eclipse.jetty:jetty-client"
  api "org.eclipse.jetty:jetty-deploy"
  api "org.eclipse.jetty:jetty-http" // implicit dependency
  api "org.eclipse.jetty:jetty-io" // implicit dependency
  api "org.eclipse.jetty:jetty-jaspi"
  api "org.eclipse.jetty:jetty-jmx"
  api "org.eclipse.jetty:jetty-jndi"
  api "org.eclipse.jetty:jetty-plus"
  api "org.eclipse.jetty:jetty-quickstart"
  api "org.eclipse.jetty:jetty-rewrite"
  api "org.eclipse.jetty:jetty-security" // implicit dependency
  api "org.eclipse.jetty:jetty-server" // implicit dependency
  api "org.eclipse.jetty:jetty-servlet"
  api "org.eclipse.jetty:jetty-servlets"
  api "org.eclipse.jetty:jetty-util-ajax"
  api "org.eclipse.jetty:jetty-util" // implicit dependency
  api "org.eclipse.jetty:jetty-webapp"
  api "org.eclipse.jetty:jetty-xml"
  api "org.eclipse.jetty.http2:http2-hpack" // implicit dependency
  api "org.eclipse.jetty.http2:http2-common"
  api "org.eclipse.jetty.http2:http2-server"
  api "org.eclipse.jetty.http2:http2-client"
  api "org.eclipse.jetty.websocket:websocket-javax-server"
  api "org.eclipse.jetty.websocket:websocket-javax-client"

  implementation "org.apache.logging.log4j:log4j-api", optional
  implementation "org.apache.logging.log4j:log4j-core", optional
  implementation "org.apache.logging.log4j:log4j-slf4j2-impl", optional
  implementation "org.apache.logging.log4j:log4j-1.2-api", optional
  implementation "org.slf4j:jul-to-slf4j", optional
  implementation "org.slf4j:jcl-over-slf4j", optional

  annotationProcessor project(':interlok-core-apt')
  testAnnotationProcessor project(':interlok-core-apt')

  javadoc project(':interlok-core-apt')

  testImplementation "org.junit.jupiter:junit-jupiter-api"
  testImplementation "org.junit.jupiter:junit-jupiter-engine"
  testImplementation "org.junit.platform:junit-platform-launcher"
  testImplementation "org.mockito:mockito-core"
  testImplementation "org.mockito:mockito-inline"
  testImplementation "org.awaitility:awaitility"
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

artifacts {
    archives javadocJar
    archives sourcesJar
}


javadoc {
  configure(options) {
    taglets = ["com.adaptris.taglet.ConfigTaglet", "com.adaptris.taglet.LicenseTaglet"]
    options.addStringOption "Xdoclint:none", "-quiet"
    options.addStringOption "tagletpath", configurations.javadoc.asPath
    options.tags('apiNote:a:API Note:', 'implSpec:a:Implementation Requirements:','implNote:a:Implementation Note:')
    title= componentName
  }
}

delombok {
  target = delombokTargetDir
}

task deleteGeneratedFiles(type: Delete) {
  delete delombokTargetDir
  delete legacyDelombokTargetDir
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java

      artifact javadocJar { classifier "javadoc" }
      artifact sourcesJar { classifier "sources" }

      pom.withXml {
        asNode().appendNode("name", componentName)
        asNode().appendNode("description", componentDesc)
        asNode().appendNode("url", "https://interlok.adaptris.net/interlok-docs/#/")
        def properties = asNode().appendNode("properties")
        properties.appendNode("target", "3.8.0+")
        properties.appendNode("license", "false")
        properties.appendNode("readme", "https://github.com/adaptris/interlok/raw/develop/README.md")
        properties.appendNode("repository", "https://github.com/adaptris/interlok")
      }
    }
  }
  repositories {
    maven {
      credentials {
        username repoUsername
        password repoPassword
      }
      url mavenPublishUrl
    }
  }
}

test {
  if (project.name == 'interlok-common') {
    include classesToTest
  }

  maxHeapSize = "1G"
  maxParallelForks = maxThreads
  jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED'

  // listen to events in the test execution lifecycle
  beforeSuite { descriptor ->
    if (verboseTestLogging()) {
      logger.lifecycle("Running: " + descriptor)
    }
  }

  if (buildDetails.is_ci_pipeline()) {
    retry {
      maxRetries = 3
      maxFailures = 20
    }
  }

  jvmArgs = ['--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED']
  useJUnitPlatform()
}

clean.dependsOn deleteGeneratedFiles
